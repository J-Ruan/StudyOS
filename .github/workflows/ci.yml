name: 校验与发布
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studyos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: 类型、检查、测试与构建
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: 使用运行器预装 Chrome
        run: google-chrome --version
      - run: npm run test:e2e
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: studyos-dist
          path: dist/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist/
  pages:
    name: 部署 GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/deploy-pages@v4
        id: deploy
  release:
    name: 发布正式版本
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: studyos-dist
          path: dist/
      - name: 打包生产产物
        run: cd dist && zip -r "../StudyOS-${GITHUB_REF_NAME}.zip" .
      - name: 发布 Release 与构建附件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "学序 $GITHUB_REF_NAME" --notes-file docs/RELEASE-v1.0.0.md
            gh release upload "$GITHUB_REF_NAME" "StudyOS-${GITHUB_REF_NAME}.zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "StudyOS-${GITHUB_REF_NAME}.zip" --title "学序 $GITHUB_REF_NAME" --notes-file docs/RELEASE-v1.0.0.md --verify-tag
          fi
